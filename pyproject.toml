[project]
name = "better-travel-assistant"
version = "0.1.0"
description = "AI 行程助手后端：往返机票 + 目的地酒店 + 热门景点 + 逐日路径规划"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: 会真实调用外部 API 并消耗额度，默认不跑（pytest -m live 显式启用）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends()/Header() 作默认参数是 FastAPI 的标准写法，B008 在这里是误报
"app/api/**" = ["B008"]
